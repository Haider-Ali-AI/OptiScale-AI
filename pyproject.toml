[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ads-optimizer"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "numpy>=2,<3", "pandas>=2.2,<3", "pyarrow>=19,<30", "psutil>=7,<8", "xgboost>=3,<4", "scikit-learn>=1.7,<2", "scipy>=1.15,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "psycopg[binary]>=3.2,<4"]
hosting = ["psycopg[binary]>=3.2,<4"]
spark = ["pyspark>=4.1,<4.3"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
ads_optimizer = ["commerce/fixtures/*.csv"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
